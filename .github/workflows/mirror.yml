name: Cross-Repository Specific Sync

on:
  push:
    branches:
      - main

jobs:
  repo-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source (assets repo)
        uses: actions/checkout@v4
        with:
          path: source-repo

      - name: Checkout Destination (tool repo)
        uses: actions/checkout@v4
        with:
          repository: 'utakeuchigames/tool'
          token: ${{ secrets.MIRROR_TOKEN }}
          path: dest-repo
          persist-credentials: false 

      - name: Sync Files
        run: |
          rm -rf dest-repo/tool/assets
          mkdir -p dest-repo/tool/assets
          rsync -av --exclude='.git' --exclude='.github' source-repo/ dest-repo/tool/assets/

      - name: Commit and Push to tool repo
        run: |
          cd dest-repo
          git config --global user.name "utakeuchigames"
          git config --global user.email "yamaki3970+1@gmail.com"
          
          git add -A
          
          if ! git diff-index --quiet HEAD; then
            COMMIT_MSG=$(cd ../source-repo && git log -1 --pretty=%B)
            git commit -m "sync: $COMMIT_MSG"
            
            # 【修正】リポジトリのフルURLにトークンを正しく埋め込みます
            git push "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@://github.com" HEAD:main
          else
            echo "No changes detected. Skipping sync."
          fi
